<div class="topbar">
  <div class="top-actions">
    <div class="search-box">
      <mat-icon class="search-icon">search</mat-icon>
      <input type="text" [(ngModel)]="busqueda" placeholder="Buscar cliente..." />
    </div>
    <button class="btn-primary" (click)="openDialog()">
      <mat-icon>add</mat-icon> Crear cliente
    </button>
  </div>
</div>

<div class="scroll-area">
  <div class="card-list" *ngIf="clientesFiltrados.length > 0; else sinResultados">
    <div class="item-card" *ngFor="let c of clientesFiltrados">
      <div class="card-stripe stripe-primary"></div>
      <div class="card-top">
        <div class="item-avatar avatar-primary">{{ initials(c) }}</div>
        <div class="item-info">
          <p class="item-nombre">{{ c.nombres }} {{ c.apellidos }}</p>
          <div class="item-meta">
            <span class="meta-chip" *ngIf="c.cedula">
              <mat-icon>badge</mat-icon>{{ c.cedula }}
            </span>
            <span class="meta-chip" *ngIf="c.telefono">
              <mat-icon>phone</mat-icon>{{ c.telefono }}
            </span>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn-action" (click)="openDialog(c)">
          <mat-icon>edit</mat-icon> Editar
        </button>
        <button class="btn-action" [routerLink]="['/app/medidas', c.idCliente]">
          <mat-icon>straighten</mat-icon> Medidas
        </button>
        <button class="btn-action btn-danger" *ngIf="puedeEliminar" (click)="eliminarCliente(c, $event)">
          <mat-icon>delete</mat-icon> Eliminar
        </button>
      </div>
    </div>
  </div>

  <ng-template #sinResultados>
    <div class="empty-state">
      <mat-icon class="empty-icon">people</mat-icon>
      <div class="empty-title">Sin clientes</div>
      <div class="empty-sub">
        <span class="empty-link" (click)="openDialog()">Crear el primero</span>
      </div>
    </div>
  </ng-template>
</div>
