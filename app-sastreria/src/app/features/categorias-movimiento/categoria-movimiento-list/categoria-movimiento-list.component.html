<div class="scroll-area">
  <p class="section-label">Categorías de movimiento</p>

  <div class="card-list" *ngIf="categorias.length > 0">
    <div class="item-card" *ngFor="let cat of categorias">
      <div class="card-stripe stripe-orange"></div>
      <div class="card-top">
        <div class="item-avatar avatar-orange">
          <mat-icon>{{ iconoPorCategoria(cat.nombreCategoriaMovimiento) }}</mat-icon>
        </div>
        <div class="item-info">
          <p class="item-nombre">{{ cat.nombreCategoriaMovimiento }}</p>
          <div class="item-meta">
            <span class="meta-chip read-only-chip">
              <mat-icon>lock</mat-icon> Solo lectura
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
