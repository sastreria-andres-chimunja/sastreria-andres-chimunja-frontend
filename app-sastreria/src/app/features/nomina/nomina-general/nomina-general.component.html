<div class="main-content">
  <div class="toolbar-clientes">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Buscar empleado..." (keyup)="applyFilter($event)" />
    </div>

    <div class="fecha-filter-wrapper">
      <button class="btn-fecha" [class.activo]="filtroFechaActivo" (click)="toggleFiltroFecha()" matTooltip="Filtrar por fecha">
        <mat-icon>date_range</mat-icon>
      </button>

      <div class="fecha-panel" *ngIf="filtroFechaAbierto">
        <div class="fecha-panel-header">
          <p class="fecha-panel-title">Rango de fechas</p>
          <button class="btn-cerrar-panel" (click)="toggleFiltroFecha()">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <div class="fecha-inputs">
          <mat-form-field appearance="outline" class="fecha-field">
            <mat-label>Desde</mat-label>
            <input matInput [matDatepicker]="pickerDesde" [formControl]="fechaInicioCtrl" placeholder="dd/mm/aaaa" readonly />
            <mat-datepicker-toggle matIconSuffix [for]="pickerDesde"></mat-datepicker-toggle>
            <mat-datepicker #pickerDesde></mat-datepicker>
          </mat-form-field>
          <mat-form-field appearance="outline" class="fecha-field">
            <mat-label>Hasta</mat-label>
            <input matInput [matDatepicker]="pickerHasta" [formControl]="fechaFinCtrl" placeholder="dd/mm/aaaa" readonly />
            <mat-datepicker-toggle matIconSuffix [for]="pickerHasta"></mat-datepicker-toggle>
            <mat-datepicker #pickerHasta></mat-datepicker>
          </mat-form-field>
        </div>
        <div class="fecha-actions">
          <button class="btn-limpiar" (click)="limpiarFiltroFecha()">Limpiar</button>
          <button class="btn-aplicar" (click)="aplicarFiltroFecha()">Aplicar</button>
        </div>
      </div>
    </div>
  </div>
  <div class="nomina-lista">
    <div class="pay-card" *ngFor="let emp of balanceFiltrado">
      <div class="card-top">
        <div class="avatar">{{ getInitials(emp.nombres) }}</div>
        <p class="pay-name">{{ emp.nombres }} {{ emp.apellidos }}</p>
      </div>
      <div class="card-amounts">
        <div class="amount-item">
          <span class="amount-label">Ingresos</span>
          <span class="amount-value income">{{
            formatCOP(emp.totalIngresos)
          }}</span>
        </div>
        <div class="amount-item">
          <span class="amount-label">Abonos</span>
          <span class="amount-value paid">{{
            formatCOP(emp.totalAbonos)
          }}</span>
        </div>
        <div class="amount-item">
          <span class="amount-label">Restante</span>
          <span
            class="amount-value"
            [class.pending]="emp.restante > 0"
            [class.zero]="emp.restante === 0"
          >
            {{ formatCOP(emp.restante) }}
          </span>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn-view"><mat-icon>list</mat-icon> Ver</button>
      </div>
    </div>
  </div>
</div>
