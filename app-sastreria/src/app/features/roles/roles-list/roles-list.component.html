<div class="topbar">
  <div class="top-actions">
    <div class="search-box">
      <mat-icon class="search-icon">search</mat-icon>
      <input type="text" [(ngModel)]="busqueda" placeholder="Buscar rol..." />
    </div>
    <button class="btn-primary" (click)="openDialogRol()">
      <mat-icon>add</mat-icon> Crear rol
    </button>
  </div>
</div>

<div class="scroll-area">
  <div class="card-list" *ngIf="rolesFiltrados.length > 0; else sinResultados">
    <div class="item-card" *ngFor="let r of rolesFiltrados">
      <div class="card-stripe stripe-purple"></div>
      <div class="card-top">
        <div class="item-avatar avatar-purple">
          <mat-icon>admin_panel_settings</mat-icon>
        </div>
        <div class="item-info">
          <p class="item-nombre">{{ r.nombre }}</p>
          <div class="item-meta">
            <span class="meta-chip"><mat-icon>tag</mat-icon>ID {{ r.idRol }}</span>
            <span class="meta-chip" *ngIf="r.descripcion">
              <mat-icon>info</mat-icon>{{ r.descripcion }}
            </span>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn-action" (click)="openDialogRol(r)">
          <mat-icon>edit</mat-icon> Editar
        </button>
        <button class="btn-action btn-danger" (click)="eliminarRol(r)">
          <mat-icon>delete</mat-icon> Eliminar
        </button>
      </div>
    </div>
  </div>

  <ng-template #sinResultados>
    <div class="empty-state">
      <mat-icon class="empty-icon">admin_panel_settings</mat-icon>
      <div class="empty-title">Sin roles</div>
      <div class="empty-sub">
        <span class="empty-link" (click)="openDialogRol()">Crear el primero</span>
      </div>
    </div>
  </ng-template>
</div>
