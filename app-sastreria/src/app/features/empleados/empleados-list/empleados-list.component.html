<div class="topbar">
  <div class="top-actions">
    <div class="search-box">
      <mat-icon class="search-icon">search</mat-icon>
      <input type="text" [(ngModel)]="busqueda" placeholder="Buscar empleado..." />
    </div>
    <button class="btn-primary" (click)="openDialog()">
      <mat-icon>add</mat-icon> Crear empleado
    </button>
  </div>
</div>

<div class="scroll-area">
  <div class="card-list" *ngIf="empleadosFiltrados.length > 0; else sinResultados">
    <div class="item-card" *ngFor="let e of empleadosFiltrados">
      <div class="card-stripe stripe-success"></div>
      <div class="card-top">
        <div class="item-avatar avatar-success">{{ initials(e) }}</div>
        <div class="item-info">
          <p class="item-nombre">{{ e.nombres }} {{ e.apellidos }}</p>
          <div class="item-meta">
            <span class="meta-chip" *ngIf="e.telefono">
              <mat-icon>phone</mat-icon>{{ e.telefono }}
            </span>
            <span class="meta-chip" *ngIf="e.fechaCumpleanios">
              <mat-icon>cake</mat-icon>{{ e.fechaCumpleanios }}
            </span>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn-action" (click)="openDialog(e)">
          <mat-icon>edit</mat-icon> Editar
        </button>
        <button class="btn-action" (click)="openDialogMovimiento(e)">
          <mat-icon>payments</mat-icon> Pago
        </button>
      </div>
    </div>
  </div>

  <ng-template #sinResultados>
    <div class="empty-state">
      <mat-icon class="empty-icon">engineering</mat-icon>
      <div class="empty-title">Sin empleados</div>
      <div class="empty-sub">
        <span class="empty-link" (click)="openDialog()">Crear el primero</span>
      </div>
    </div>
  </ng-template>
</div>
