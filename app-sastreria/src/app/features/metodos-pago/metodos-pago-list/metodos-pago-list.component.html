<div class="topbar">
  <div class="top-actions">
    <div class="search-box">
      <mat-icon class="search-icon">search</mat-icon>
      <input type="text" [(ngModel)]="busqueda" placeholder="Buscar método de pago..." />
    </div>
    <button class="btn-primary" (click)="openDialog()">
      <mat-icon>add</mat-icon> Crear método de pago
    </button>
  </div>
</div>

<div class="scroll-area">
  <div class="card-list" *ngIf="metodosFiltrados.length > 0; else sinResultados">
    <div class="item-card" *ngFor="let m of metodosFiltrados">
      <div class="card-stripe stripe-teal"></div>
      <div class="card-top">
        <div class="item-avatar avatar-teal">
          <mat-icon>credit_card</mat-icon>
        </div>
        <div class="item-info">
          <p class="item-nombre">{{ m.nombreMetodoPago }}</p>
          <div class="item-meta">
            <span class="meta-chip"><mat-icon>tag</mat-icon>ID {{ m.idMetodoPago }}</span>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn-action" (click)="openDialog(m)">
          <mat-icon>edit</mat-icon> Editar
        </button>
        <button class="btn-action btn-danger" (click)="eliminarMetodoPago(m)">
          <mat-icon>delete</mat-icon> Eliminar
        </button>
      </div>
    </div>
  </div>

  <ng-template #sinResultados>
    <div class="empty-state">
      <mat-icon class="empty-icon">credit_card</mat-icon>
      <div class="empty-title">Sin métodos de pago</div>
      <div class="empty-sub">
        <span class="empty-link" (click)="openDialog()">Crear el primero</span>
      </div>
    </div>
  </ng-template>
</div>
