<h2 mat-dialog-title class="dialog-title">
  <mat-icon>verified_user</mat-icon>
  Nueva garantía
</h2>

<mat-dialog-content class="mat-typography">
  <p class="dialog-subtitle">
    Registra un trabajo que tuviste que rehacer sin costo para el cliente.
  </p>
  <div class="form-wrapper">
    <form [formGroup]="form" autocomplete="off">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Nombre del cliente</mat-label>
        <mat-icon matPrefix>person</mat-icon>
        <input matInput formControlName="nombreCliente" placeholder="Ej: Juan Carlos Pérez" />
        <mat-error *ngIf="form.get('nombreCliente')?.hasError('required')">
          El nombre del cliente es requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Valor</mat-label>
        <mat-icon matPrefix>payments</mat-icon>
        <input matInput formControlName="valor" type="number" min="1" placeholder="Ej: 30000" />
        <mat-error *ngIf="form.get('valor')?.hasError('required')">
          El valor es requerido
        </mat-error>
        <mat-error *ngIf="form.get('valor')?.hasError('min')">
          El valor debe ser mayor a 0
        </mat-error>
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>

<!-- Loading overlay sobre el dialog completo -->
<div class="loading-overlay" *ngIf="isLoading">
  <mat-spinner diameter="48"></mat-spinner>
  <p class="loading-text">Registrando garantía...</p>
</div>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-stroked-button (click)="cerrar()" [disabled]="isLoading">
    Cancelar
  </button>
  <button
    mat-raised-button
    color="primary"
    (click)="guardar()"
    [disabled]="isLoading || form.invalid"
  >
    <mat-icon>save</mat-icon>
    Guardar
  </button>
</mat-dialog-actions>
